name: Tests

on:
  push:
    branches: [main, master, develop, feature/testing]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mallor_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DB_NAME: mallor_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      TEST_DB_NAME: test_mallor
      MALLOR_DATA_ENCRYPTION_KEY: test-only-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Django checks
        run: python manage.py check --settings=config.settings_test

      - name: Migration dry-run
        run: python manage.py makemigrations --check --dry-run --settings=config.settings_test

      - name: Backend tests
        run: python -m pytest --cov --cov-report=term-missing

      - name: Backend coverage gate - empresa core
        run: python -m coverage report --include="empresa/services.py,empresa/middleware.py,empresa/views.py" --fail-under=66

      - name: Backend coverage gate - IA segura
        run: python -m coverage report --include="IA/context.py,IA/services.py,IA/tools.py,IA/views.py" --fail-under=74

      - name: Backend coverage gate - informes
        run: python -m coverage report --include="informes/services.py,informes/views.py" --fail-under=42

      - name: Backend coverage gate - inventario y usuario
        run: python -m coverage report --include="inventario/services.py,usuario/services.py,usuario/views.py" --fail-under=44

      - name: Backend coverage gate - Factus
        run: python -m coverage report --include="ventas/facturacion_services.py,ventas/security.py" --fail-under=69

      - name: Critical multitenant tests
        run: python -m pytest -m multitenant

      - name: Critical IA tests
        run: python -m pytest -m ia

      - name: Critical Factus tests
        run: python -m pytest -m factus

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend tests
        run: npm run test -- --run

      - name: Frontend coverage
        run: npm run test:coverage

      - name: Frontend build
        run: npm run build
