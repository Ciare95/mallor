[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = tests.py test_*.py *_tests.py
testpaths =
    empresa
    cliente
    inventario
    proveedor
    fabricante
    ventas
    informes
    usuario
    IA
markers =
    unit: pruebas unitarias de modelos, serializers y funciones puras
    integration: pruebas que cruzan varias capas del backend
    multitenant: pruebas de aislamiento por empresa_id y empresa activa
    ia: pruebas del modulo IA seguro multitenant
    factus: pruebas de facturacion electronica con Factus mockeado
    smoke: pruebas criticas de disponibilidad o flujos principales
addopts =
    --reuse-db
    --strict-markers
    --tb=short
