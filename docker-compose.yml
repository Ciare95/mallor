services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mallor}
      MYSQL_USER: ${MYSQL_USER:-mallor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD es obligatorio}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD es obligatorio}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mallor

  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: "False"
      MALLOR_MODE: cloud
      MALLOR_SERVE_FRONTEND: "True"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatorio}
      # La contraseña de MySQL debe ser URL-safe (sin : / @ #). Si no, define
      # DATABASE_URL directamente en el .env del servidor con el valor urlencoded.
      DATABASE_URL: "mysql://${MYSQL_USER:-mallor}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-mallor}"
      MEDIA_ROOT: /app/media
      # CloudPanel termina el SSL; la app no debe redirigir a HTTPS por su cuenta
      SECURE_SSL_REDIRECT: "False"
      # MySQL está en la red interna de Docker: no requiere SSL
      DB_SSL_REQUIRE: "False"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS}${ALLOWED_HOSTS:+,}localhost,127.0.0.1"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - ${MEDIA_HOST_PATH:-/opt/mallor/media}:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - mallor

volumes:
  mysql_data:

networks:
  mallor:
    driver: bridge
